name: Windows CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Testing/**'
      - 'artifacts/**'
      - 'Screenshots/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    # 刻意不在 pull_request 上设 paths-ignore：被 paths-ignore 跳过的 workflow
    # 不会创建任何 check，而分支保护的必需检查指向 `gate`，纯文档 PR 会一直卡在
    # "Expected — Waiting for status to be reported"。
    # 改由 job 级判断（changes）跳过重量级校验，`gate` 始终运行并给出结论。
  workflow_dispatch:

permissions:
  contents: read

# tauri.conf.json 配置 updater pubkey 后，bundle 构建需要 TAURI_SIGNING_PRIVATE_KEY；
# Secret 未配置（PR/fork）时由 ensure-updater-signing-key.ps1 生成一次性临时密钥兜底。
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 路径感知：判断本次变更是否包含"非文档"内容，决定要不要跑重量级校验。
  # 忽略清单与原来的 paths-ignore 保持一致（见文件头的 push 配置）。
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Detect relevant changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "非 PR 事件（push）：视为需要完整校验"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.base_ref }}"
          git fetch --no-tags origin "$base" || true
          files="$(git diff --name-only "origin/$base"...HEAD || true)"
          echo "changed files:"
          printf '%s\n' "$files"
          ignore='(^|/)[^/]*\.md$|^(docs|Testing|Screenshots|artifacts)/|^\.gitignore$|^LICENSE$'
          code="$(printf '%s\n' "$files" | grep -vE "$ignore" | grep -v '^$' || true)"
          if [ -n "$code" ]; then
            echo "包含非文档改动，需要完整校验"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "仅文档改动，跳过重量级校验"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          # arm64 助手的**编译路径**要在 CI 里被真实覆盖（本机常常没有 VS 的 ARM64
          # 工具集，那条路径永远不会被执行到），因此显式装 aarch64 目标供下方
          # `cargo check --target` 使用。
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure updater signing key (CI fallback for missing secret)
        shell: pwsh
        run: ./scripts/ensure-updater-signing-key.ps1

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # tauri.conf 的 bundle.resources 声明了 helper 与 gadget，而这两个文件不入库
      # ⇒ tauri-build 在编译期就会校验路径存在，先暂存再编译（2026-09-27 PR #127 实测）。
      # 本 job 不设 SAYALL_REQUIRE_ARM64_PAYLOAD：arm64 载荷在 verify 里是**可选**的
      # （runner 具备 ARM64 工具集时会一并构建并暂存，缺了也不算失败；发布路径的强制
      # 要求设在 installer job 的 staging 步骤）。
      - name: Stage bundle resources (helper + frida gadget; arm64 optional here)
        run: node scripts/stage-bundle-inputs.cjs

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test unified input Helper and report agent
        shell: pwsh
        run: |
          cargo test --locked --manifest-path hardware/RC003/helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node hardware/RC003/helper/agent/agent_logic_test.mjs
          exit $LASTEXITCODE

      - name: Test isolated installer contracts
        shell: pwsh
        run: |
          node --test scripts/test-windows-overlay-install.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-capture-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-retired-files.ps1
          exit $LASTEXITCODE
      # arm64 助手的编译路径必须被真实覆盖：本机与部分环境没有 VS ARM64 工具集，
      # 那条路径平时永远不会被执行到（issue206 的根因之一）。
      # `cargo check` 只做类型检查并产出元数据，**不调用链接器**，因此不依赖
      # Microsoft.VisualStudio.Component.VC.Tools.ARM64；真正需要该组件的是 installer
      # job 的 staging 步骤（`cargo build --target aarch64-pc-windows-msvc`）。
      - name: Check RC003 helper compiles for Windows on ARM (aarch64)
        run: cargo check --target aarch64-pc-windows-msvc --manifest-path hardware/RC003/helper/Cargo.toml

      - name: Check Windows Tauri host
        run: cargo check --workspace

      - name: Build Windows runtime simulation
        shell: pwsh
        run: |
          $env:VITE_SAYALL_RUNTIME_SIMULATION = "1"
          pnpm tauri build --no-bundle --features runtime-simulation

      # 防回归（2026-10-03 本机实证）：补丁 build.frontendDist 误用 Windows 绝对路径时，
      # tauri 会把它当单字母 scheme 的 URL，前端资源不嵌入、界面变成目录列表，
      # 而哈希/签名/内嵌修订号全部正常——只有对 exe 做“资源键是否在二进制里”的检查才能发现。
      - name: Verify frontend assets are embedded in the executable
        shell: pwsh
        run: ./scripts/verify-frontend-embedded.ps1

      - name: Test Windows Tauri WebView and IPC runtime simulation
        shell: pwsh
        timeout-minutes: 3
        run: ./scripts/test-windows-runtime-simulation.ps1

  # 安装器构建与生命周期矩阵只在合入 main 后或人工点跑时执行。
  # PR 仍由 verify 覆盖前端、Rust 和 runtime simulation，避免每次提交都重复
  # 构建 NSIS 并执行耗时的安装、升级、降级和卸载测试。
  installer:
    name: Verify Windows installer lifecycle
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # staging 要 **构建** arm64 助手（cargo build --target aarch64-...），因此本
          # job 也必须装 aarch64 目标；链接器由 windows-2025 镜像自带的 VS ARM64
          # 工具集提供（见下方 staging 步骤的注释）。
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure updater signing key (CI fallback for missing secret)
        shell: pwsh
        run: ./scripts/ensure-updater-signing-key.ps1

      # arm64 双载荷（2026-10-07 issue206）：默认 src-tauri/tauri.conf.json 只声明 x64
      # 两件，因为 tauri-build 在**编译期**校验资源存在，而 arm64 助手需要 VS 的
      # Microsoft.VisualStudio.Component.VC.Tools.ARM64 才能构建（本机没有它 ⇒ 写进
      # 默认配置会让任何 cargo check / cargo test 都直接失败）。
      # windows-2025 托管镜像自带 ARM64 构建工具（actions/runner-images 的 Windows2025
      # 组件表里 Microsoft.VisualStudio.Component.VC.Tools.ARM64 在列），因此发布路径
      # **强制**要求 arm64 载荷：这里设 SAYALL_REQUIRE_ARM64_PAYLOAD=1，缺失即让 staging
      # 非零退出，不允许静默产出一个在 Windows 11 ARM64 上缺载荷的安装包。
      - name: Stage bundle resources (helper + frida gadget, x64 + arm64)
        env:
          SAYALL_REQUIRE_ARM64_PAYLOAD: "1"
        run: node scripts/stage-bundle-inputs.cjs

      - name: Build predecessor NSIS upgrade fixture
        shell: pwsh
        run: ./scripts/build-windows-upgrade-fixture.ps1

      # arm64 覆盖配置（tauri 的 --config 可重复，按 RFC 7396 顺序合并，数组整体覆盖）：
      # staging 已保证四件载荷都在 src-tauri/，这里把 bundle.resources 覆盖成四件。
      - name: Build unsigned NSIS preview installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.arm64-payload.conf.json
        env:
          SAYALL_BUNDLE_BUILD: "1"

      # 防回归（2026-10-03 本机实证）：见 verify job 中同名步骤的注释。
      - name: Verify frontend assets are embedded in the executable
        shell: pwsh
        run: ./scripts/verify-frontend-embedded.ps1

      - name: Test retired-file recycling, overlay compile and write diagnostics
        shell: pwsh
        run: |
          powershell -NoProfile -STA -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-retired-files.ps1 -RealRecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-windows-overlay-compile.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-installer-write-log.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-reinstall-flow.ps1
          exit $LASTEXITCODE

      - name: Verify runtime simulation is absent from production build
        shell: pwsh
        run: ./scripts/verify-runtime-simulation-isolation.ps1

      - name: Verify installer identity and create checksums
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1

      - name: Test install upgrade downgrade and uninstall matrix
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/test-windows-install-lifecycle-matrix.ps1

      - name: Test silent current-user install and uninstall
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/test-windows-silent-install.ps1

      - name: Test installer graceful exit while the app is running
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/test-windows-installer-graceful-exit.ps1

      - name: Upload unsigned preview installer
        uses: actions/upload-artifact@v4
        with:
          name: sayall-windows-unsigned-preview-${{ github.sha }}
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: gate
    needs: [changes, verify, installer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate upstream results
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }} verify=${{ needs.verify.result }} installer=${{ needs.installer.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed"
            exit 1
          fi
          case "${{ needs.verify.result }}" in
            success) echo "verify passed";;
            skipped) echo "verify skipped（仅文档改动）";;
            *) echo "::error::verify did not pass: ${{ needs.verify.result }}"; exit 1;;
          esac
          if [ "${{ github.event_name }}" != "pull_request" ] && \
             [ "${{ needs.changes.outputs.code }}" = "true" ] && \
             [ "${{ needs.installer.result }}" != "success" ]; then
            echo "::error::installer did not pass: ${{ needs.installer.result }}"
            exit 1
          fi

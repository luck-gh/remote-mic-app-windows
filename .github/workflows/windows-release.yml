name: Windows Release

# 正式发布管线（应用内更新通道）：
# 1. push 形如 v0.2.0 的 tag 触发；
# 2. 用仓库 Secret TAURI_SIGNING_PRIVATE_KEY 构建 minisign 签名的 NSIS 安装器
#    （缺 Secret 直接失败——禁止用一次性密钥发布正式更新包）；
# 3. 验签后将签名写入 latest.json，暂存 ASCII 文件名的安装器；
# 4. 创建 DRAFT Release 并上传安装器与清单，正文记录安装器 SHA-256
#    （releases/latest/download/latest.json 只统计已发布的稳定 Release）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SAYALL_BUNDLE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 发布路径必须带 arm64 载荷（见下方 staging / build 两步），因此本 job 也要
          # 装 aarch64 目标供 `cargo build --target aarch64-pc-windows-msvc` 使用；
          # 链接器由 windows-2025 镜像自带的 VS ARM64 工具集提供。
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secret is present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 TAURI_SIGNING_PRIVATE_KEY 仓库 Secret：正式 Release 必须用正式更新签名密钥构建（私钥丢失即无法再向存量用户推送更新，请先在 GitHub Secrets 配置并本地备份私钥）"
          }
          Write-Host "正式更新签名密钥已就绪"

      # 同 windows-ci.yml：bundle.resources 的两件文件不入库，编译期就需要它们存在。
      # 发布路径**强制**要求 arm64 双载荷（windows-2025 镜像自带 VS ARM64 工具集）：
      # SAYALL_REQUIRE_ARM64_PAYLOAD=1 让 arm64 缺失时 staging 非零退出，而不是静默
      # 产出一个在 Windows 11 ARM64 上缺载荷的安装包。
      - name: Stage bundle resources (helper + frida gadget, x64 + arm64)
        env:
          SAYALL_REQUIRE_ARM64_PAYLOAD: "1"
        run: node scripts/stage-bundle-inputs.cjs

      - name: Build signed NSIS installer
        # arm64 覆盖配置：默认 tauri.conf.json 只声明 x64 两件（tauri-build 编译期
        # 校验资源存在，arm64 助手在没有 VS ARM64 工具集的机器上构建不出来），
        # 这里把 bundle.resources 覆盖成四件。--config 可重复，按 RFC 7396 顺序合并。
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.arm64-payload.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密码变量缺失时 tauri build 会交互式等待输入（无 TTY 的 CI 上挂死，
          # 2026-09-06 本机矩阵实验实证）；正式密钥为无密码密钥，Secret 未配置时
          # 此处求值为空字符串，实测空字符串 + 无密码密钥可免交互完成签名。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 防回归（2026-10-03 本机实证）：补丁 build.frontendDist 误用 Windows 绝对路径时，
      # tauri 会把它当单字母 scheme 的 URL，前端资源不嵌入、界面变成目录列表。
      - name: Verify frontend assets are embedded in the executable
        shell: pwsh
        run: ./scripts/verify-frontend-embedded.ps1

      - name: Generate updater manifest and stage release assets
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          ./scripts/verify-updater-signing.ps1 -Installer $installers[0].FullName
          ./scripts/generate-updater-manifest.ps1 -Tag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY

      - name: Create draft GitHub release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repositoryUrl = "https://github.com/$env:GITHUB_REPOSITORY"
          $assetDirectory = "artifacts/windows-release"
          $installerName = "SayAll-Windows-$($tag.TrimStart('v'))-x64-setup.exe"
          $installerUrl = "$repositoryUrl/releases/download/$tag/$installerName"
          $installer = Get-Item -LiteralPath (Join-Path $assetDirectory $installerName)
          $manifest = Get-Item -LiteralPath (Join-Path $assetDirectory "latest.json")
          $assets = @($installer.FullName, $manifest.FullName)
          $installerSha = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestSha = (Get-FileHash -LiteralPath $manifest.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "将上传到 Draft Release $tag 的资产清单"
          Write-Host "- $installerName ($($installer.Length) bytes, SHA-256 $installerSha)"
          Write-Host "- latest.json ($($manifest.Length) bytes, SHA-256 $manifestSha)"
          # 发布前根据发布 PR 补齐版本变化、升级限制和实际验证结果。
          $notes = @"
          # 无线麦 Windows 个人版 $tag 预览版

          ## 下载与安装

          [**下载 Windows 安装包（.exe）**]($installerUrl)

          手动安装只需上面的安装包。适用于 64 位 Windows 10 1809 或更新版本。
          安装器 SHA-256 ``$installerSha``。
          此安装器已验证应用更新签名，Windows Authenticode 代码签名尚未启用。

          ## 版本记录

          构建对应提交 ``$env:GITHUB_SHA``。
          [对应源码与提交记录]($repositoryUrl/commit/$env:GITHUB_SHA)
          "@
          gh release create $tag --draft --prerelease --title "无线麦 · 个人版 $tag 预览版" --notes $notes @assets
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create 失败（exit $LASTEXITCODE；若 Release 已存在请人工核对后处理，本流程不做任何删除/覆盖）"
          }
          Write-Host "Draft Release $tag 已创建并挂载资产，等待人工核对与 Publish"

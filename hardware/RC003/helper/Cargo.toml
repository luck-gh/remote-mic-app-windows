[package]
name = "rc003-helper"
version = "0.1.0-spike"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "RC003 增强捕获轨（路线 A）提权助手 —— 产品化 spike，尚未并入产品工作区"

# 故意不并入顶层 workspace：本 crate 处于 spike 阶段，E1–E6 真机验收尚未全部完成。
# 一旦验收通过并决定产品化，把它移入 crates/ 并加进 workspace members 即可
# （届时要让 `cargo fmt/test/check --workspace` 一并覆盖它）。
[workspace]

# bin 名即 UAC 弹窗里显示的程序名（无版本资源时）——用 SayAll 而不是
# rc003-helper，用户在授权弹窗里看到的名字才有归属感。
[[bin]]
name = "sayall-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[dev-dependencies]
quick-xml = { version = "=0.41.0", features = ["serialize"] }
